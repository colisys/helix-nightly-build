name: Build and release Helix nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Helix branch, tag, or commit
        required: false
        default: master
        type: string
      tag:
        description: Release tag
        required: false
        default: nightly
        type: string
      publish:
        description: Create/update the GitHub Release
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 3 * * 1,4"

permissions:
  contents: write

env:
  HELIX_REF: ${{ inputs.ref || 'master' }}

jobs:
  check:
    name: Check for upstream updates
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.sha }}
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - name: Resolve upstream HEAD
        id: resolve
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/helix-editor/helix.git "${HELIX_REF}" | awk '{print $1}')
          if [[ -z "$sha" ]]; then
            echo "Failed to resolve upstream ref ${HELIX_REF}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream ${HELIX_REF} is $sha"

      - name: Check if already built for this SHA
        id: cache-check
        uses: actions/cache@v4
        with:
          path: /tmp/helix-built-marker
          key: helix-built-${{ steps.resolve.outputs.sha }}

      - name: Determine whether build is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ steps.cache-check.outputs.cache-hit }}" == "true" ]]; then
            echo "No new upstream commits since last build — skipping."
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [check]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.check.outputs.build_needed == 'true' ||
        needs.check.result == 'skipped'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: archive,deb,rpm
            qemu: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            formats: archive,deb,rpm
            qemu: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            formats: archive,exe,msi
            qemu: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Check out Helix source
        uses: actions/checkout@v4
        with:
          repository: helix-editor/helix
          ref: ${{ env.HELIX_REF }}
          path: .helix-source
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo downloads only
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('.helix-source/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Linux cross compiler and QEMU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user-binfmt

      - name: Install nfpm
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build nfpm from the official Go module
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/nfpm" --version

      - name: Install Windows packagers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset innosetup --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure ARM64 C/C++ toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version
          aarch64-linux-gnu-ar --version

      - name: Build and package
        shell: bash
        run: |
          qemu_args=()
          if [[ -n "${{ matrix.qemu }}" ]]; then qemu_args=(--qemu "${{ matrix.qemu }}"); fi
          PYTHONPATH=src python -m helix_nightly \
            --ref "${HELIX_REF}" \
            --target "${{ matrix.target }}" \
            --formats "${{ matrix.formats }}" \
            --grammar "${qemu_args[@]}" \
            --output-dir dist

      - name: Verify Linux binary architecture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary=".helix-source/target/${{ matrix.target }}/release/hx"
          file "$binary"
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            file "$binary" | grep -qi aarch64
          else
            file "$binary" | grep -Eqi 'x86-64|x86_64'
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: helix-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Create upstream build marker
        if: github.event_name == 'schedule' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p /tmp/helix-built-marker
          echo "${{ needs.check.outputs.upstream_sha }}" > /tmp/helix-built-marker/sha

      - name: Mark upstream SHA as built
        if: github.event_name == 'schedule' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/cache/save@v4
        with:
          path: /tmp/helix-built-marker
          key: helix-built-${{ needs.check.outputs.upstream_sha }}

  release:
    name: Create GitHub Release
    needs: build
    if: |
      needs.build.result == 'success' && (
        github.event_name == 'schedule' || inputs.publish == true
      )
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Select release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; reusing it."
          else
            git tag --annotate "${RELEASE_TAG}" "${GITHUB_SHA}" --message "Helix nightly ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Helix ${{ steps.tag.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
