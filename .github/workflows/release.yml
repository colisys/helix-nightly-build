name: Build and release Helix nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Helix branch, tag, or commit
        required: false
        default: master
        type: string
      tag:
        description: Release tag
        required: false
        default: nightly
        type: string

  schedule:
    - cron: "17 3 * * 1,4"

permissions:
  contents: write

env:
  HELIX_REF: ${{ inputs.ref || 'master' }}

jobs:
  check:
    name: Check for upstream updates
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'
    outputs:
      upstream_sha: ${{ steps.resolve.outputs.sha }}
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - name: Resolve upstream HEAD
        id: resolve
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/helix-editor/helix.git "${HELIX_REF}" | awk '{print $1}')
          if [[ -z "$sha" ]]; then
            echo "Failed to resolve upstream ref ${HELIX_REF}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream ${HELIX_REF} is $sha"

      - name: Check if already built for this SHA
        id: cache-check
        uses: actions/cache@v4
        with:
          path: /tmp/helix-built-marker
          key: helix-built-${{ steps.resolve.outputs.sha }}

      - name: Determine whether build is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ steps.cache-check.outputs.cache-hit }}" == "true" ]]; then
            echo "No new upstream commits since last build — skipping."
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [check]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.check.outputs.build_needed == 'true' ||
        needs.check.result == 'skipped'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: archive,deb,rpm,apk
            grammar: true
            qemu: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            formats: archive,deb,rpm,apk
            grammar: true
            qemu: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            formats: archive,deb,rpm,apk
            grammar: true
            qemu: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            formats: archive,deb,rpm,apk
            grammar: true
            qemu: qemu-aarch64 -L /opt/musl-cross/aarch64-linux-musl-cross/aarch64-linux-musl
          - os: ubuntu-22.04
            target: riscv64gc-unknown-linux-musl
            formats: archive,deb,rpm,apk
            grammar: true
            qemu: qemu-riscv64 -L /opt/musl-cross/riscv64-linux-musl-cross/riscv64-linux-musl
          - os: ubuntu-22.04
            target: riscv64gc-unknown-linux-gnu
            formats: archive,deb,rpm,apk
            grammar: true
            qemu: qemu-riscv64 -L /usr/riscv64-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            formats: archive,exe
            grammar: true
            qemu: ""
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            formats: archive,exe
            grammar: false
            qemu: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Check out Helix source
        uses: actions/checkout@v4
        with:
          repository: helix-editor/helix
          ref: ${{ env.HELIX_REF }}
          path: .helix-source
          fetch-depth: 1

      - name: Resolve Helix source revision
        id: source-revision
        shell: bash
        run: echo "sha=$(git -C .helix-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo, target, and fetched grammars
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            .helix-source/target
            .helix-source/runtime/grammars
          key: helix-build-v2-${{ runner.os }}-${{ matrix.target }}-${{ steps.source-revision.outputs.sha }}-${{ hashFiles('.helix-source/Cargo.lock', '.helix-source/rust-toolchain.toml', '.helix-source/rust-toolchain', '.helix-source/runtime/languages.toml') }}
          restore-keys: |
            helix-build-v2-${{ runner.os }}-${{ matrix.target }}-

      - name: Report build cache
        shell: bash
        run: |
          echo "Build cache hit: ${{ steps.build-cache.outputs.cache-hit || 'false' }}"

      - name: Install Linux cross compiler and QEMU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            musl-tools \
            qemu-user-binfmt

      - name: Install musl cross toolchains
        if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'riscv64gc-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /opt/musl-cross
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            toolchain=aarch64-linux-musl
          else
            toolchain=riscv64-linux-musl
          fi
          curl --fail --location --retry 3 \
            "https://musl.cc/${toolchain}-cross.tgz" \
            | tar -xz -C /opt/musl-cross
          echo "/opt/musl-cross/${toolchain}-cross/bin" >> "$GITHUB_PATH"

      - name: Install nfpm
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build nfpm from the official Go module
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/nfpm" --version

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'riscv64gc-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'riscv64gc-unknown-linux-musl'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            {
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
              echo "CC_x86_64_unknown_linux_musl=musl-gcc"
              echo "CXX_x86_64_unknown_linux_musl=musl-gcc"
              echo "AR_x86_64_unknown_linux_musl=ar"
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker=musl-gcc"
            } >> "$GITHUB_ENV"
            musl-gcc --version
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            {
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc"
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc"
              echo "CXX_aarch64_unknown_linux_musl=aarch64-linux-musl-g++"
              echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker=aarch64-linux-musl-gcc"
            } >> "$GITHUB_ENV"
            aarch64-linux-musl-gcc --version
          elif [[ "${{ matrix.target }}" == "riscv64gc-unknown-linux-musl" ]]; then
            {
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER=riscv64-linux-musl-gcc"
              echo "CC_riscv64gc_unknown_linux_musl=riscv64-linux-musl-gcc"
              echo "CXX_riscv64gc_unknown_linux_musl=riscv64-linux-musl-g++"
              echo "AR_riscv64gc_unknown_linux_musl=riscv64-linux-musl-ar"
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker=riscv64-linux-musl-gcc"
            } >> "$GITHUB_ENV"
            riscv64-linux-musl-gcc --version
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            {
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
              echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
              echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc"
            } >> "$GITHUB_ENV"
            aarch64-linux-gnu-gcc --version
            aarch64-linux-gnu-g++ --version
            aarch64-linux-gnu-ar --version
          else
            {
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc"
              echo "CC_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-gcc"
              echo "CXX_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-g++"
              echo "AR_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-ar"
              echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker=riscv64-linux-gnu-gcc"
            } >> "$GITHUB_ENV"
            riscv64-linux-gnu-gcc --version
            riscv64-linux-gnu-g++ --version
            riscv64-linux-gnu-ar --version
          fi

      - name: Build and package
        shell: bash
        run: |
          qemu_args=()
          grammar_args=()
          if [[ -n "${{ matrix.qemu }}" ]]; then qemu_args=(--qemu "${{ matrix.qemu }}"); fi
          if [[ "${{ matrix.grammar }}" == "true" ]]; then grammar_args=(--grammar "${qemu_args[@]}"); fi
          PYTHONPATH=src python -m helix_nightly \
            --ref "${HELIX_REF}" \
            --target "${{ matrix.target }}" \
            --formats "${{ matrix.formats }}" \
            "${grammar_args[@]}" \
            --output-dir dist

      - name: Verify Linux binary architecture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary=".helix-source/target/${{ matrix.target }}/release/hx"
          file "$binary"
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            file "$binary" | grep -qi aarch64
          elif [[ "${{ matrix.target }}" == riscv64* ]]; then
            file "$binary" | grep -Eqi 'RISC-V|riscv'
          else
            file "$binary" | grep -Eqi 'x86-64|x86_64'
          fi

      - name: Report compiled grammar libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          grammar_dir=.helix-source/runtime/grammars
          count=$(find "$grammar_dir" -maxdepth 1 -type f -name '*.so' | wc -l)
          bytes=$(find "$grammar_dir" -maxdepth 1 -type f -name '*.so' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          echo "Compiled grammar libraries: $count files, $bytes bytes"
          find "$grammar_dir" -maxdepth 1 -type f -name '*.so' -printf '%f %s bytes\n' | sort || true

      - name: Report package sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("dist").iterdir()):
              print(f"{path.name}: {path.stat().st_size} bytes")
          PY

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: helix-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Create upstream build marker
        if: github.event_name == 'schedule' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p /tmp/helix-built-marker
          echo "${{ needs.check.outputs.upstream_sha }}" > /tmp/helix-built-marker/sha

      - name: Mark upstream SHA as built
        if: github.event_name == 'schedule' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/cache/save@v4
        with:
          path: /tmp/helix-built-marker
          key: helix-built-${{ needs.check.outputs.upstream_sha }}

  release:
    name: Create GitHub Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Select release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve upstream revision
        id: upstream
        shell: bash
        env:
          UPSTREAM_REF: ${{ env.HELIX_REF }}
        run: |
          sha=$(git ls-remote https://github.com/helix-editor/helix.git "$UPSTREAM_REF" | awk 'NR == 1 { print $1 }')
          if [[ -z "$sha" ]]; then sha="$UPSTREAM_REF"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Write release description
        shell: bash
        env:
          UPSTREAM_REF: ${{ env.HELIX_REF }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          cat > release-notes.md <<EOF
          This is an unofficial nightly build of [Helix](https://github.com/helix-editor/helix), published by [helix-nightly-build](https://github.com/${{ github.repository }}).

          The binaries were built from upstream ref $UPSTREAM_REF at commit [$UPSTREAM_SHA](https://github.com/helix-editor/helix/commit/$UPSTREAM_SHA).

          This release is generated by the builder project and is not an official Helix release. It contains the artifacts produced by the successful platform builds for this run, including GNU/Linux, musl Linux, RISC-V Linux, Windows x86_64, and Windows ARM64 where available.
          EOF

      - name: Create Git tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; reusing it."
          else
            git tag --annotate "${RELEASE_TAG}" "${GITHUB_SHA}" --message "Helix nightly ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Helix ${{ steps.tag.outputs.tag }}
          prerelease: true
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
