name: Build and release Helix nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Helix branch, tag, or commit
        required: false
        default: master
        type: string
      tag:
        description: Release tag
        required: false
        default: nightly
        type: string
      publish:
        description: Create/update the GitHub Release
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

env:
  HELIX_REF: ${{ inputs.ref || 'master' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: archive,deb,rpm
            qemu: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            formats: archive,deb,rpm
            qemu: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            formats: archive,exe,msi
            qemu: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed
          ls "$(rustc --print sysroot)/lib/rustlib/${{ matrix.target }}/lib/libcore-"*.rlib >/dev/null

      - name: Install Linux cross compiler and QEMU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-binfmt
          curl -fsSL https://nfpm.goreleaser.com/install.sh | sh -s -- -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Windows packagers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset innosetup --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        run: |
          qemu_args=()
          if [[ -n "${{ matrix.qemu }}" ]]; then qemu_args=(--qemu "${{ matrix.qemu }}"); fi
          PYTHONPATH=src python -m helix_nightly \
            --ref "${HELIX_REF}" \
            --target "${{ matrix.target }}" \
            --formats "${{ matrix.formats }}" \
            --grammar "${qemu_args[@]}" \
            --output-dir dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: helix-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'schedule' || inputs.publish == true
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Select release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Helix ${{ steps.tag.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
