[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-nightly-build"
version = "0.1.0"
description = "Build multi-platform Helix editor archives for GitHub Releases"
requires-python = ">=3.10"

[project.scripts]
helix-nightly = "helix_nightly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
